<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GENESIS — The Evolutionary Collection Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #040508;
      --card-bg: rgba(14, 18, 27, 0.75);
      --card-border: rgba(0, 242, 254, 0.18);
      --genesis-cyan: #00f2fe;
      --genesis-violet: #7928ca;
      --accent-gold: #ffb700;
      --accent-green: #00e676;
      --rarity-epic: #b026ff;
      --text-main: #f3f4f6;
      --text-muted: #8b95a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Fond Étoilé Dynamique Canvas */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* App Viewport Mobile-First */
    .app-viewport {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 900px;
      background: rgba(8, 11, 19, 0.85);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.15);
      z-index: 1;
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 36px;
        height: 94vh;
        border: 1px solid var(--card-border);
      }
    }

    /* Header HUD */
    .hud-header {
      position: relative;
      z-index: 10;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(4, 5, 8, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }

    .brand-logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--genesis-cyan), var(--genesis-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .currency-badge {
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--genesis-cyan);
      transition: transform 0.2s;
    }

    .currency-badge.bump {
      transform: scale(1.15);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* Router Screen Container */
    .screen-container {
      flex: 1;
      position: relative;
      z-index: 5;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: none;
    }

    .screen-container::-webkit-scrollbar { display: none; }

    .screen {
      display: none;
      animation: fadeIn 0.3s ease-out forwards;
    }

    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Signature Glass Card Genesis */
    .genesis-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 14px;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .genesis-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--genesis-cyan), var(--genesis-violet));
    }

    /* Creature Display Showcase */
    .creature-showcase {
      background: radial-gradient(circle at 50% 40%, rgba(176, 38, 255, 0.15) 0%, rgba(14, 18, 27, 0.9) 75%);
      border: 1px solid var(--rarity-epic);
      border-radius: 28px;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .creature-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .rarity-pill {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(176, 38, 255, 0.2);
      border: 1px solid var(--rarity-epic);
      color: #e2a2ff;
    }

    .possession-rate {
      font-size: 0.7rem;
      color: var(--accent-gold);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Canvas pour la Créature Vivante */
    .creature-canvas-container {
      width: 180px;
      height: 180px;
      margin: 10px auto;
      position: relative;
    }

    #creatureCanvas {
      width: 100%;
      height: 100%;
    }

    .creature-title-group h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
    }

    .mutation-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--genesis-cyan);
      color: var(--genesis-cyan);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Creature Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 16px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
    }

    .stat-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      background: var(--genesis-cyan);
    }

    /* Collection Counter Bar */
    .collection-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 242, 254, 0.05);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .collection-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .collection-count {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--genesis-cyan);
    }

    /* Action Buttons & Missions */
    .btn-claim {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent-gold), #ff8800);
      color: #040508;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(255, 183, 0, 0.3);
      transition: all 0.2s;
    }

    .btn-claim:active { transform: scale(0.97); }

    .btn-claim.done {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      box-shadow: none;
      cursor: default;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Navigation Dock Bottom */
    .nav-dock {
      position: relative;
      z-index: 10;
      padding: 12px 16px;
      background: rgba(4, 5, 8, 0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--genesis-cyan);
    }

    .nav-icon { font-size: 1.2rem; }
  </style>
</head>
<body>

  <!-- Fond Étoilé Dynamique -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-viewport">

    <!-- Header HUD -->
    <header class="hud-header">
      <div class="brand-logo">
        <span>⚙️</span> GENESIS
      </div>

      <div class="currency-badge" id="currencyBadge">
        <span>💎</span>
        <span id="creditVal">1 250</span>
      </div>
    </header>

    <!-- Content Router Screen -->
    <main class="screen-container">

      <!-- SCREEN DASHBOARD JEU -->
      <section id="scr-dashboard" class="screen active">

        <!-- Barre de Collection Globale -->
        <div class="collection-banner">
          <span class="collection-title">INDEX DE COLLECTION</span>
          <span class="collection-count">9 / 120 <span style="font-size:0.7rem; color:var(--text-muted);">(7.5%)</span></span>
        </div>

        <!-- Fiche de la Créature Active -->
        <div class="creature-showcase">
          <div class="creature-header">
            <span class="rarity-pill">ÉPIQUE</span>
            <span class="possession-rate">🔥 2.8% DES JOUEURS</span>
          </div>

          <!-- Zone Canvas de la Créature Animée -->
          <div class="creature-canvas-container">
            <canvas id="creatureCanvas" width="180" height="180"></canvas>
          </div>

          <div class="creature-title-group">
            <h2>ASTRA-KAEL #009</h2>
            <div class="mutation-tag">🧬 PRISMATIC MUTATION</div>
          </div>

          <!-- Statistiques de la Créature -->
          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-label">ATTAQUE</div>
              <div class="stat-value">72</div>
              <div class="stat-bar"><div class="stat-fill" style="width: 72%;"></div></div>
            </div>
            <div class="stat-box">
              <div class="stat-label">ÉNERGIE</div>
              <div class="stat-value" style="color:var(--accent-gold);">91</div>
              <div class="stat-bar"><div class="stat-fill" style="width: 91%; background:var(--accent-gold);"></div></div>
            </div>
            <div class="stat-box">
              <div class="stat-label">EXPLORATION</div>
              <div class="stat-value" style="color:var(--accent-green);">64</div>
              <div class="stat-bar"><div class="stat-fill" style="width: 64%; background:var(--accent-green);"></div></div>
            </div>
          </div>
        </div>

        <!-- Mission avec Bouton de Récompense Dynamique -->
        <div class="genesis-card" style="margin-top: 14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-size:0.75rem; font-weight:800; color:var(--text-muted); letter-spacing:1px; font-family:'Orbitron';">MISSION DISPONIBLE</span>
            <span style="font-size:0.7rem; color:var(--accent-green); font-weight:700;">COMPLÉTÉE</span>
          </div>
          <div style="font-weight:700; font-size:0.9rem; margin-bottom:12px;">Découvrir 1 nouvelle mutation Prismatic</div>
          
          <button class="btn-claim" id="claimBtn" onclick="claimReward()">
            <span>RÉCUPÉRER +150 💎</span>
          </button>
        </div>

      </section>

    </main>

    <!-- Navigation Dock -->
    <nav class="nav-dock">
      <button class="nav-item active">
        <span class="nav-icon">🐾</span>
        <span>Créature</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon">🗺️</span>
        <span>Exploration</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon">🔮</span>
        <span>Capsules</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon">📖</span>
        <span>Index</span>
      </button>
    </nav>

  </div>

  <script>
    /* ===================================================
       1. FOND ÉTOILÉ DYNAMIQUE (Canvas Space)
       =================================================== */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    resizeBg();
    window.addEventListener('resize', resizeBg);

    const stars = Array.from({ length: 60 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2,
      alpha: Math.random(),
      speed: 0.005 + Math.random() * 0.015
    }));

    function drawBg() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        bgCtx.fillStyle = `rgba(0, 242, 254, ${Math.abs(star.alpha) * 0.5})`;
        bgCtx.beginPath();
        bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        bgCtx.fill();
      });
      requestAnimationFrame(drawBg);
    }
    drawBg();

    /* ===================================================
       2. CRÉATURE ANIMÉE VIVANTE (Canvas 2D)
       =================================================== */
    const cCanvas = document.getElementById('creatureCanvas');
    const ctx = cCanvas.getContext('2d');

    let tick = 0;
    let blinkTimer = 0;
    let isBlinking = false;

    function drawCreature() {
      ctx.clearRect(0, 0, 180, 180);
      tick += 0.04;

      const centerX = 90;
      const centerY = 90 + Math.sin(tick) * 5; // Mouvement de respiration / flottaison

      // 1. Aura d'Habitat Prismatic
      const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 65);
      gradient.addColorStop(0, 'rgba(0, 242, 254, 0.4)');
      gradient.addColorStop(0.6, 'rgba(176, 38, 255, 0.2)');
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 65, 0, Math.PI * 2);
      ctx.fill();

      // 2. Corps Astral de la Créature
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 3;

      ctx.beginPath();
      // Tête / Corps de type "Astra-Kael" (Forme organique Sci-Fi)
      ctx.moveTo(centerX - 35, centerY - 10);
      ctx.bezierCurveTo(centerX - 40, centerY - 45, centerX + 40, centerY - 45, centerX + 35, centerY - 10);
      ctx.bezierCurveTo(centerX + 50, centerY + 30, centerX - 50, centerY + 30, centerX - 35, centerY - 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cornes Célestes
      ctx.strokeStyle = '#b026ff';
      ctx.beginPath();
      ctx.moveTo(centerX - 20, centerY - 35);
      ctx.lineTo(centerX - 38, centerY - 55);
      ctx.moveTo(centerX + 20, centerY - 35);
      ctx.lineTo(centerX + 38, centerY - 55);
      ctx.stroke();

      // 3. Yeux Expressifs avec Clignotement
      blinkTimer++;
      if (blinkTimer > 120) {
        isBlinking = true;
        if (blinkTimer > 130) {
          isBlinking = false;
          blinkTimer = 0;
        }
      }

      ctx.fillStyle = '#00f2fe';
      if (!isBlinking) {
        // Oeil Gauche
        ctx.beginPath();
        ctx.arc(centerX - 14, centerY - 10, 6, 0, Math.PI * 2);
        ctx.fill();

        // Oeil Droit
        ctx.beginPath();
        ctx.arc(centerX + 14, centerY - 10, 6, 0, Math.PI * 2);
        ctx.fill();

        // Pupilles brillantes
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(centerX - 12, centerY - 12, 2, 0, Math.PI * 2);
        ctx.arc(centerX + 16, centerY - 12, 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Yeux fermés (Ligne)
        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX - 20, centerY - 10);
        ctx.lineTo(centerX - 8, centerY - 10);
        ctx.moveTo(centerX + 8, centerY - 10);
        ctx.lineTo(centerX + 20, centerY - 10);
        ctx.stroke();
      }

      // 4. Particules en flottaison autour de la créature
      for (let i = 0; i < 3; i++) {
        const pAngle = tick + (i * 2);
        const px = centerX + Math.cos(pAngle) * 45;
        const py = centerY + Math.sin(pAngle * 0.8) * 35;
        ctx.fillStyle = i % 2 === 0 ? '#00f2fe' : '#ffb700';
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(drawCreature);
    }
    drawCreature();

    /* ===================================================
       3. LOGIQUE JEU & RÉCOMPENSES
       =================================================== */
    let credits = 1250;
    let claimed = false;

    // Web Audio Synthétiseur minimal
    function playRewardSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
      osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.2); // C6

      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function claimReward() {
      if (claimed) return;
      claimed = true;

      playRewardSound();
      credits += 150;

      // Animation du compteur de crédits
      const creditEl = document.getElementById('creditVal');
      const badgeEl = document.getElementById('currencyBadge');
      
      creditEl.innerText = credits.toLocaleString();
      badgeEl.classList.add('bump');
      setTimeout(() => badgeEl.classList.remove('bump'), 300);

      // Mise à jour du bouton
      const btn = document.getElementById('claimBtn');
      btn.classList.add('done');
      btn.innerHTML = '<span>✓ RÉCOMPENSE RÉCUPÉRÉE</span>';
    }
  </script>
</body>
</html>
