<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CÉSAR CLAW — Machine à Trophées</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Fredoka', cursive, sans-serif;
    }

    body {
      background: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Modal Email */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .auth-card {
      background: #73d6c7;
      border: 4px solid #ffffff;
      border-radius: 32px;
      padding: 30px 25px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 15px 0 #329183, 0 25px 30px rgba(0,0,0,0.5);
    }

    .auth-card h1 {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 4px 0 #2b7a6f;
      margin-bottom: 8px;
    }

    .auth-card p {
      color: #1a4d46;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .auth-input {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      border: 3px solid #329183;
      background: #fff;
      color: #333;
      font-size: 1.1rem;
      outline: none;
      margin-bottom: 15px;
      text-align: center;
    }

    .btn-pop {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      border: 3px solid #fff;
      background: #ff5252;
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c62828;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-pop:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c62828;
    }

    /* Machine Arcade Frame */
    .arcade-machine {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 820px;
      background: #7be5d6;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    @media (min-width: 500px) {
      .arcade-machine {
        border-radius: 40px;
        border: 8px solid #52c2b3;
        height: 95vh;
      }
    }

    /* Top Bar HUD */
    .top-bar {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      background: #ff5252;
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #c62828;
      cursor: pointer;
    }

    .icon-btn::after {
      content: '🏠';
      font-size: 1.4rem;
    }

    .pill-counter {
      background: rgba(255, 255, 255, 0.85);
      border: 3px solid #52c2b3;
      padding: 6px 16px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    }

    .pill-counter .coin-icon {
      width: 26px;
      height: 26px;
      background: #ffd54f;
      border: 2px solid #ffb300;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #b78103;
      font-size: 0.8rem;
    }

    .pill-val {
      font-size: 1.2rem;
      font-weight: 700;
      color: #2e7d71;
    }

    /* Game Canvas Glass Screen */
    .screen-container {
      flex: 1;
      margin: 0 12px;
      background: #a8f3ea;
      border-radius: 25px;
      border: 4px solid #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.08);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Dashboard Bottom Control Panel */
    .control-deck {
      height: 150px;
      background: #80ebd2;
      border-top: 6px solid #4eb8a9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      gap: 10px;
    }

    .deck-buttons {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .joystick-base {
      width: 70px;
      height: 70px;
      background: #52c2b3;
      border-radius: 50%;
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 #3a968a;
      cursor: pointer;
    }

    .joystick-knob {
      width: 38px;
      height: 38px;
      background: #ff7043;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 4px 0 #d84315;
    }

    .red-action-btn {
      width: 85px;
      height: 60px;
      background: #ff5252;
      border: 4px solid #fff;
      border-radius: 30px;
      box-shadow: 0 6px 0 #c62828;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .red-action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c62828;
    }

    .ad-banner-btn {
      width: 100%;
      padding: 10px;
      background: #ffd54f;
      border: 3px solid #fff;
      border-radius: 16px;
      color: #6d4c41;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #ffb300;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Modal Pub */
    .ad-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .ad-card {
      background: #fff;
      padding: 30px;
      border-radius: 30px;
      text-align: center;
      max-width: 320px;
      border: 5px solid #ffd54f;
    }

    .ad-timer {
      font-size: 3rem;
      font-weight: 800;
      color: #ff5252;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <!-- Modal Auth -->
  <div class="auth-overlay" id="authModal">
    <div class="auth-card">
      <h1>CÉSAR CLAW</h1>
      <p>Inscris-toi avec ton e-mail pour recevoir 10 crédits gratuits !</p>
      <form onsubmit="handleAuth(event)">
        <input type="email" id="userEmail" class="auth-input" placeholder="ton.email@exemple.com" required>
        <button type="submit" class="btn-pop">JOUER (10 🪙)</button>
      </form>
    </div>
  </div>

  <!-- Modal Pub -->
  <div class="ad-overlay" id="adModal">
    <div class="ad-card">
      <h3 style="color: #333;">PUBLICITÉ CÉSAR</h3>
      <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">Regarde la pub pour gagner 5 Crédits !</p>
      <div class="ad-timer" id="adTimer">30</div>
      <p style="color: #aaa; font-size: 0.8rem;">Crédités à la fin du chrono.</p>
    </div>
  </div>

  <!-- Machine Arcade -->
  <div class="arcade-machine">
    <!-- Top HUD -->
    <div class="top-bar">
      <div class="icon-btn" onclick="location.reload()"></div>
      <div class="pill-counter">
        <div class="coin-icon">🪙</div>
        <div class="pill-val" id="creditsVal">0</div>
      </div>
    </div>

    <!-- Screen Canvas -->
    <div class="screen-container">
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Controls -->
    <div class="control-deck">
      <div class="deck-buttons">
        <div class="joystick-base" onclick="moveClaw(-25)">
          <div class="joystick-knob"></div>
        </div>
        <button class="red-action-btn" onclick="dropClaw()">PRENDRE</button>
        <div class="joystick-base" onclick="moveClaw(25)">
          <div class="joystick-knob"></div>
        </div>
      </div>
      <button class="ad-banner-btn" onclick="watchAd()">
        📺 Regarder une vidéo (+5 🪙)
      </button>
    </div>
  </div>

  <script>
    let credits = 0;
    let score = 0;
    let audioCtx = null;

    function handleAuth(e) {
      e.preventDefault();
      credits = 10;
      document.getElementById('creditsVal').innerText = credits;
      document.getElementById('authModal').style.display = 'none';
      initAudio();
    }

    function watchAd() {
      const modal = document.getElementById('adModal');
      const timer = document.getElementById('adTimer');
      modal.style.display = 'flex';
      let left = 30;
      timer.innerText = left;

      const inv = setInterval(() => {
        left--;
        timer.innerText = left;
        if (left <= 0) {
          clearInterval(inv);
          modal.style.display = 'none';
          credits += 5;
          document.getElementById('creditsVal').innerText = credits;
          playWinSound();
        }
      }, 1000);
    }

    /* Audio Synth */
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playWinSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.3);
    }

    function playLoseSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(250, now);
      osc.frequency.linearRampToValueAtTime(120, now + 0.4);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.4);
    }

    /* Engine Canvas Engine */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let clawX = 150;
    let clawY = 60;
    let clawState = 'idle';
    let grabbedItem = null;

    // Items pastel cartoon (style image)
    const items = [
      { x: 50,  y: 380, r: 22, type: 'basket', color: '#ff7043' },
      { x: 110, y: 390, r: 18, type: 'coin', color: '#ffd54f' },
      { x: 160, y: 375, r: 24, type: 'blue', color: '#42a5f5' },
      { x: 220, y: 385, r: 20, type: 'egg', color: '#ab47bc' },
      { x: 280, y: 370, r: 23, type: 'basket', color: '#ff7043' },
      { x: 320, y: 390, r: 18, type: 'coin', color: '#ffd54f' }
    ];

    function moveClaw(dir) {
      if (clawState !== 'idle') return;
      clawX += dir;
      if (clawX < 40) clawX = 40;
      if (clawX > canvas.width - 40) clawX = canvas.width - 40;
    }

    function dropClaw() {
      if (clawState !== 'idle') return;
      if (credits <= 0) {
        alert("Tu n'as plus de crédits ! Regarde une vidéo.");
        return;
      }
      credits--;
      document.getElementById('creditsVal').innerText = credits;
      clawState = 'dropping';
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fond Villes Silhouette Kawaii
      ctx.fillStyle = '#92e8dc';
      ctx.fillRect(0, canvas.height - 120, canvas.width, 120);

      // Dessin des Objets
      items.forEach(it => {
        ctx.save();
        ctx.translate(it.x, it.y);

        if (it.type === 'basket') {
          ctx.fillStyle = '#ff7043';
          ctx.beginPath();
          ctx.arc(0, 0, it.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 3;
          ctx.stroke();
        } else if (it.type === 'coin') {
          ctx.fillStyle = '#ffd54f';
          ctx.beginPath();
          ctx.arc(0, 0, it.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffb300';
          ctx.lineWidth = 4;
          ctx.stroke();
        } else {
          ctx.fillStyle = it.color;
          ctx.beginPath();
          ctx.arc(0, 0, it.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        ctx.restore();
      });

      // Mouvement Pince
      if (clawState === 'dropping') {
        clawY += 5;
        if (clawY >= canvas.height - 90) {
          clawState = 'grabbing';
          items.forEach(it => {
            if (Math.abs(it.x - clawX) < 25 && !grabbedItem) {
              grabbedItem = it;
            }
          });
          setTimeout(() => { clawState = 'returning'; }, 400);
        }
      } else if (clawState === 'returning') {
        clawY -= 4;
        if (grabbedItem) {
          grabbedItem.y = clawY + 35;
          grabbedItem.x = clawX;
        }
        if (clawY <= 60) {
          clawState = 'idle';
          if (grabbedItem) {
            playWinSound();
            grabbedItem.y = canvas.height - 80;
            grabbedItem.x = Math.random() * (canvas.width - 80) + 40;
            grabbedItem = null;
          } else {
            playLoseSound();
          }
        }
      }

      // Câble de la pince
      ctx.strokeStyle = '#6d4c41';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(clawX, 0);
      ctx.lineTo(clawX, clawY);
      ctx.stroke();

      // Pince Cute Cartoon (Tête jaune avec yeux)
      ctx.save();
      ctx.translate(clawX, clawY);

      // Yeux et sourire
      ctx.fillStyle = '#ffd54f';
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-22, -15, 44, 30, 10);
      ctx.fill();
      ctx.stroke();

      // Yeux
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(-8, -2, 4, 0, Math.PI * 2);
      ctx.arc(8, -2, 4, 0, Math.PI * 2);
      ctx.fill();

      // Sourire
      ctx.beginPath();
      ctx.arc(0, 3, 5, 0, Math.PI);
      ctx.stroke();

      // Bras de pince
      ctx.strokeStyle = '#b0bec5';
      ctx.lineWidth = 5;
      const angle = (clawState === 'grabbing') ? 0.2 : 0.5;

      ctx.beginPath();
      ctx.moveTo(-15, 10);
      ctx.lineTo(-28 * Math.cos(angle), 35 * Math.sin(angle));
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(15, 10);
      ctx.lineTo(28 * Math.cos(angle), 35 * Math.sin(angle));
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
