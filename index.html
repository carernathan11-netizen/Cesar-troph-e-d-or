--card-border: rgba(139, 92, 246, 0.25);
--card-border-glow: rgba(217, 70, 239, 0.5);

--text-muted: #a1a1aa;

--danger: #ef4444;

html, body {
width: 100%; height: 100%;
background-color: var(--bg-dark); color: var(--text-main);
font-family: 'Plus Jakarta Sans', sans-serif;
overflow: hidden;
}

.app-viewport {
width: 100vw; height: 100vh; height: 100svh;
display: flex; flex-direction: column; position: relative;
background: #050508;
background-image:

}

.hud-header {
height: 65px; flex-shrink: 0; padding: 0 20px;

background: rgba(10, 8, 20, 0.7); backdrop-filter: blur(20px);
border-bottom: 1px solid var(--card-border); z-index: 20;
box-shadow: 0 4px 30px rgba(139, 92, 246, 0.15);
}
.brand-logo {
font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 1.3rem; letter-spacing: 3px;
background: linear-gradient(135deg, #fff 30%, var(--glow-magenta));
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
display: flex; align-items: center; gap: 8px;
}
.brand-dot {
width: 10px; height: 10px; background: var(--glow-violet); border-radius: 50%;
box-shadow: 0 0 12px var(--glow-magenta), 0 0 20px var(--glow-violet);
}
.pill {
background: rgba(139, 92, 246, 0.12); border: 1px solid var(--card-border-glow);
padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 800; color: #fff;
font-family: 'Space Grotesk', sans-serif; box-shadow: 0 0 15px rgba(217, 70, 239, 0.2);
}

.screen-container { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.screen { display: none; width: 100%; }
.screen.active { display: flex; flex-direction: column; gap: 14px; }

.glass-card {
background: var(--card-bg); border: 1px solid var(--card-border);
border-radius: 22px; padding: 18px; backdrop-filter: blur(25px);
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); position: relative; overflow: hidden;
}
.glass-card::before {
content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
background: linear-gradient(90deg, transparent, var(--glow-magenta), transparent); opacity: 0.5;
}

.card-title {
font-family: 'Space Grotesk', sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;
color: var(--glow-cyan); margin-bottom: 12px; display: flex; justify-content: space-between; font-weight: 700;
}

.btn {
width: 100%; padding: 14px; border-radius: 16px; border: none;
background: linear-gradient(135deg, var(--glow-violet), var(--glow-magenta));
color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 0.9rem;
cursor: pointer; text-align: center; box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
transition: transform 0.2s, box-shadow 0.2s;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
.btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); box-shadow: none; }
.btn-danger { background: linear-gradient(135deg, #ef4444, #991b1b); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
.btn-success { background: linear-gradient(135deg, #22c55e, #15803d); box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }

.input-field {
width: 100%; padding: 14px; background: rgba(15, 12, 29, 0.8);
border: 1px solid var(--card-border); border-radius: 14px; color: #fff; font-family: inherit; margin-bottom: 10px; outline: none;
}
.input-field:focus { border-color: var(--glow-magenta); box-shadow: 0 0 10px rgba(217, 70, 239, 0.3); }

.app-toast {
position: fixed; top: 75px; left: 50%; transform: translateX(-50%) translateY(-20px);
background: rgba(15, 12, 29, 0.95); border: 1px solid var(--card-border-glow);
padding: 12px 20px; border-radius: 14px; z-index: 1000; font-size: 0.85rem; font-weight: 600;
box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: all 0.3s ease;
display: flex; align-items: center; gap: 8px; max-width: 90vw; text-align: center;
}
.app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.app-toast.error { border-color: var(--danger); color: #fca5a5; }
.app-toast.success { border-color: var(--success); color: #86efac; }

.binder-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
.binder-tabs::-webkit-scrollbar { display: none; }
