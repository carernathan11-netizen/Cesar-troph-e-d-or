<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLDEN CLAW — La Pince des César</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0c10;
      --card-bg: rgba(22, 24, 29, 0.85);
      --gold: #d4af37;
      --gold-light: #fff2a8;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Ambient Glow Background */
    .bg-glow {
      position: fixed;
      top: -10vh;
      left: 50%;
      transform: translateX(-50%);
      width: 90vw;
      height: 70vh;
      background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(90px);
    }

    /* Modal d'inscription */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 30px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .auth-card h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
      transition: border 0.3s;
    }

    .auth-input:focus {
      border-color: var(--gold);
    }

    .btn-gold {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--gold), #b8860b);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px var(--gold-glow);
    }

    /* Interface Principale du Jeu */
    .game-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gold-light);
    }

    /* Canvas de la Pince Arcade */
    #arcadeCanvas {
      background: #111318;
      border: 2px solid var(--gold);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 20px rgba(212, 175, 55, 0.1);
      width: 100%;
      height: 420px;
    }

    /* Panneau de Contrôle */
    .controls-panel {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .btn-ctrl {
      flex: 1;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-ctrl:active {
      background: rgba(212, 175, 55, 0.2);
    }

    .btn-drop {
      background: linear-gradient(135deg, var(--gold), #b8860b);
      color: #000;
      border: none;
    }

    .ad-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--gold);
      color: var(--gold-light);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Modal Pub simulée */
    .ad-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
      text-align: center;
    }

    .ad-box {
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 20px;
      background: #181920;
      max-width: 350px;
    }

    .ad-timer {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--gold);
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Ecran d'inscription Email -->
  <div class="auth-overlay" id="authModal">
    <div class="auth-card">
      <h1>CÉSAR CLAW</h1>
      <p>Entrez votre e-mail pour recevoir 10 crédits cadeaux et accéder à la pince.</p>
      <form onsubmit="handleAuth(event)">
        <input type="email" id="userEmail" class="auth-input" placeholder="nom@exemple.com" required>
        <button type="submit" class="btn-gold">Recevoir 10 Crédits</button>
      </form>
    </div>
  </div>

  <!-- Modal Pub Interstitielle (Simulée) -->
  <div class="ad-overlay" id="adModal">
    <div class="ad-box">
      <div style="font-size: 0.75rem; color: var(--text-muted); letter-spacing: 2px;">SPONSOR PUBLICITAIRE</div>
      <h2 style="margin-top: 10px; color: #fff;">Académie des César 2026</h2>
      <p style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">Regardez cette vidéo pour débloquer +5 Crédits de jeu.</p>
      <div class="ad-timer" id="adTimer">30</div>
      <p style="font-size: 0.75rem; color: var(--text-muted);">Récompense créditée automatiquement à la fin du décompte.</p>
    </div>
  </div>

  <!-- Zone de Jeu -->
  <div class="game-wrapper">
    <div class="header-bar">
      <div class="stat-box">
        <span class="stat-label">Joueur</span>
        <span class="stat-val" id="displayMail" style="font-size: 0.85rem;">-</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Score</span>
        <span class="stat-val" id="scoreVal">0 pts</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Crédits</span>
        <span class="stat-val" id="creditsVal">0</span>
      </div>
    </div>

    <!-- Canvas Arcade -->
    <canvas id="arcadeCanvas" width="400" height="420"></canvas>

    <!-- Contrôles -->
    <div class="controls-panel">
      <button class="btn-ctrl" onclick="moveClaw(-15)">◄</button>
      <button class="btn-ctrl btn-drop" onclick="dropClaw()">LANCER</button>
      <button class="btn-ctrl" onclick="moveClaw(15)">►</button>
    </div>

    <button class="ad-btn" onclick="watchAd()">
      <span>🎬</span> Regarder une pub (+5 Crédits)
    </button>
  </div>

  <script>
    /* ===================================================
       1. GESTION DES ETATS ET CREDITS
       =================================================== */
    let credits = 0;
    let score = 0;
    let email = "";
    let audioCtx = null;

    function handleAuth(e) {
      e.preventDefault();
      email = document.getElementById('userEmail').value;
      credits = 10;
      document.getElementById('displayMail').innerText = email.split('@')[0];
      document.getElementById('creditsVal').innerText = credits;
      document.getElementById('authModal').style.display = 'none';
      initAudio();
      playBgMusic();
    }

    function watchAd() {
      const modal = document.getElementById('adModal');
      const timerEl = document.getElementById('adTimer');
      modal.style.display = 'flex';
      let left = 30;
      timerEl.innerText = left;

      const interval = setInterval(() => {
        left--;
        timerEl.innerText = left;
        if (left <= 0) {
          clearInterval(interval);
          modal.style.display = 'none';
          credits += 5;
          document.getElementById('creditsVal').innerText = credits;
          playWinSound();
        }
      }, 1000);
    }

    /* ===================================================
       2. SYSTEME AUDIO SYNTHETIQUE (Web Audio API)
       =================================================== */
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBgMusic() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(130, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    function playWinSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.4); // C6
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.4);
    }

    function playLoseSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(110, now + 0.5);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.5);
    }

    /* ===================================================
       3. MOTEUR DE JEU CANVAS 2D (LA PINCE A TROPHEES)
       =================================================== */
    const canvas = document.getElementById('arcadeCanvas');
    const ctx = canvas.getContext('2d');

    let clawX = canvas.width / 2;
    let clawY = 40;
    let clawState = 'idle'; // 'idle', 'dropping', 'grabbing', 'returning'
    let grabbedItem = null;

    // Trophées positionnés au fond de la machine
    const trophies = [
      { x: 60, y: 370, radius: 18, points: 10, color: '#d4af37' },
      { x: 130, y: 375, radius: 15, points: 20, color: '#fff2a8' },
      { x: 200, y: 370, radius: 22, points: 5,  color: '#cd7f32' },
      { x: 270, y: 375, radius: 16, points: 15, color: '#d4af37' },
      { x: 340, y: 370, radius: 20, points: 50, color: '#e5e4e2' }
    ];

    function moveClaw(dir) {
      if (clawState !== 'idle') return;
      clawX += dir;
      if (clawX < 40) clawX = 40;
      if (clawX > canvas.width - 40) clawX = canvas.width - 40;
    }

    function dropClaw() {
      if (clawState !== 'idle') return;
      if (credits <= 0) {
        alert("Crédits insuffisants ! Regardez une pub pour recharger.");
        return;
      }
      credits--;
      document.getElementById('creditsVal').innerText = credits;
      clawState = 'dropping';
    }

    function updateGame() {
      // Logique de descente/remontée de la pince
      if (clawState === 'dropping') {
        clawY += 4;
        if (clawY >= 340) {
          clawState = 'grabbing';
          // Détections de collision avec les trophées
          trophies.forEach(t => {
            if (Math.abs(t.x - clawX) < 25 && !grabbedItem) {
              grabbedItem = t;
            }
          });
          setTimeout(() => { clawState = 'returning'; }, 500);
        }
      } else if (clawState === 'returning') {
        clawY -= 3;
        if (grabbedItem) {
          grabbedItem.y = clawY + 25;
          grabbedItem.x = clawX;
        }
        if (clawY <= 40) {
          clawState = 'idle';
          if (grabbedItem) {
            // Chance de faire tomber le trophée en haut (suspense)
            if (Math.random() > 0.25) {
              score += grabbedItem.points;
              document.getElementById('scoreVal').innerText = score + " pts";
              playWinSound();
              // Réinitialisation du trophée au sol
              grabbedItem.y = 370;
              grabbedItem.x = Math.random() * 300 + 50;
            } else {
              playLoseSound();
              grabbedItem.y = 370;
            }
            grabbedItem = null;
          } else {
            playLoseSound();
          }
        }
      }

      render();
      requestAnimationFrame(updateGame);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dessin des trophées
      trophies.forEach(t => {
        ctx.save();
        ctx.fillStyle = t.color;
        ctx.beginPath();
        // Socle
        ctx.fillRect(t.x - 10, t.y, 20, 10);
        // Corps du Trophée
        ctx.arc(t.x, t.y - 10, t.radius / 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Dessin du câble
      ctx.strokeStyle = '#8e8e93';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(clawX, 0);
      ctx.lineTo(clawX, clawY);
      ctx.stroke();

      // Dessin de la Pince en Métal
      ctx.save();
      ctx.translate(clawX, clawY);
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 5;

      // Tête de la pince
      ctx.fillStyle = '#222';
      ctx.fillRect(-15, -10, 30, 15);

      // Bras gauche et droit
      const openAngle = (clawState === 'grabbing') ? 0.2 : 0.6;
      
      // Bras gauche
      ctx.beginPath();
      ctx.moveTo(-10, 5);
      ctx.lineTo(-25 * Math.cos(openAngle), 25 * Math.sin(openAngle));
      ctx.stroke();

      // Bras droit
      ctx.beginPath();
      ctx.moveTo(10, 5);
      ctx.lineTo(25 * Math.cos(openAngle), 25 * Math.sin(openAngle));
      ctx.stroke();

      ctx.restore();
    }

    // Lancement de la boucle de rendu
    requestAnimationFrame(updateGame);
  </script>
</body>
</html>
